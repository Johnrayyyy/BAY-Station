{% extends "base.html" %}

{% block title %}LostLink Home{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-3 text-center">
                <a href="/" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-header kiosk-header text-white text-center">
                    <h3 class="mb-0"><i class="fas fa-search-location"></i> LostLink</h3>
                </div>
                <div class="card-body text-center p-4">
                    <p class="lead">Report and recover lost items on campus.</p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a href="{{ url_for('lostlink.login') }}" class="btn btn-kiosk">Login</a>
                        <a href="{{ url_for('lostlink.register') }}" class="btn btn-outline-danger">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
