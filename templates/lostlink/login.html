{% extends "base.html" %}

{% block title %}LostLink Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header kiosk-header text-white text-center">
                    <h4 class="mb-0"><i class="fas fa-user-lock"></i> LostLink Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{{ url_for('lostlink.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-kiosk w-100">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('lostlink.register') }}" class="kiosk-link">Create account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
