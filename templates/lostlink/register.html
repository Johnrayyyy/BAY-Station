{% extends "base.html" %}

{% block title %}LostLink Register{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-header kiosk-header text-white">
                    <h4 class="mb-0"><i class="fas fa-user-plus"></i> LostLink Registration</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{{ url_for('lostlink.register') }}" class="row g-3">
                        <div class="col-md-4"><label class="form-label">SR Code</label><input name="sr_code" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
                        <div class="col-md-4"><label class="form-label">Age</label><input name="age" type="number" min="1" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">First Name</label><input name="name" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Surname</label><input name="surname" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Contact</label><input name="contact" class="form-control" required></div>
                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select" required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Prefer not to say">Prefer not to say</option>
                            </select>
                        </div>
                        <div class="col-md-6"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-kiosk" type="submit">Create Account</button>
                            <a class="btn btn-outline-danger" href="{{ url_for('lostlink.login') }}">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
