{% extends "base.html" %}

{% block title %}Grievance Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header kiosk-header text-white text-center">
                    <h4 class="mb-0"><i class="fas fa-user-shield"></i> Grievance Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="get" action="{{ url_for('grievance.student_dashboard') }}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button class="btn btn-kiosk w-100" type="submit">Log In</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('grievance.register') }}" class="kiosk-link">Create account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
