{% extends "base.html" %}

{% block title %}RGO Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header kiosk-header text-white text-center">
                    <h4 class="mb-0"><i class="fas fa-sign-in-alt"></i> RGO Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{{ url_for('rgo.login') }}">
                        <input type="hidden" name="next" value="{{ next_url if next_url is defined else request.args.get('next', '') }}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ email if email is defined else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-kiosk w-100">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <a class="kiosk-link" href="{{ url_for('rgo.register') }}">Create student account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
