{% extends "base.html" %}

{% block title %}RGO Admin Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0"><i class="fas fa-lock"></i> RGO Admin Login</h3>
                    <small class="text-light">Records & Grade Office Management</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label"><i class="fas fa-user"></i> Username</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter admin username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label"><i class="fas fa-key"></i> Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-muted text-center small">
                        <i class="fas fa-lock"></i> Default credentials: admin / admin123
                    </p>
                </div>
                <div class="card-footer text-center bg-light py-3">
                    <a href="/rgo/app" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-arrow-left"></i> Back to RGO
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
