{% extends "base.html" %}

{% block title %}RGO Register{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header kiosk-header text-white">
                    <h4 class="mb-0"><i class="fas fa-user-plus"></i> Student Registration</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{{ url_for('rgo.register') }}" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ name if name is defined else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Student ID</label>
                            <input type="text" name="student_id" class="form-control" value="{{ student_id if student_id is defined else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ email if email is defined else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-kiosk" type="submit">Register</button>
                            <a class="btn btn-outline-danger" href="{{ url_for('rgo.login') }}">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
